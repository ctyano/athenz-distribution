name: Build and Publish Docker Image

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  # If any commit message in your push or the HEAD commit of your PR contains the strings
  # [skip ci], [ci skip], [no ci], [skip actions], or [actions skip]
  # workflows triggered on the push or pull_request events will be skipped.
  # https://github.blog/changelog/2021-02-08-github-actions-skip-pull-request-and-push-workflows-with-skip-ci/
  workflow_call:
    inputs:
      tracking_git_repo:
        description: 'Tracking GitHub repository in owner/name format'
        required: false
        default: 'AthenZ/athenz'
        type: string
      tracking_git_ref:
        description: 'Tracking git ref to build, such as a branch, tag, or commit SHA'
        required: false
        default: ''
        type: string
      target_version:
        description: 'Target version to release this repository e.g. 0.0.0'
        required: false
        default: ''
        type: string
      current_version:
        description: 'Current released version of this repository e.g. 0.0.0'
        required: false
        default: ''
        type: string
      publish_images:
        description: 'Push images and publish multi-platform manifests'
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      tracking_git_repo:
        description: 'Tracking GitHub repository in owner/name format'
        required: false
        default: 'AthenZ/athenz'
        type: string
      tracking_git_ref:
        description: 'Tracking git ref to build, such as a branch, tag, or commit SHA'
        required: false
        default: ''
        type: string
      target_version:
        description: 'Target version to release this repository e.g. 0.0.0'
        required: false
        default: ''
        type: string
      current_version:
        description: 'Current released version of this repository e.g. 0.0.0'
        required: false
        default: ''
        type: string
      publish_images:
        description: 'Push images and publish multi-platform manifests'
        required: false
        default: true
        type: boolean
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.gemini/**'
      - '*.md'
      - 'docs/**'

env:
  # Use docker.io for Docker Hub if empty
  DOCKER_REGISTRY_URL: ghcr.io
  # DOCKER_REGISTRY_OWNER: ${{ env.CI_REPOSITORY_OWNER }}
  # DOCKER_REGISTRY_IMAGE: ${{ env.CI_REPOSITORY_NAME }}
  # DOCKER_REGISTRY_TOKEN: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
  DOCKER_TAEGET_PLATFORMS: linux/amd64,linux/arm64
  #DOCKER_BUILD_ARGS: |
  TRACKING_GIT_REPO: AthenZ/athenz
  TRACKING_GIT_REF: ''
  LINUX_RUNNER: ubuntu-latest
  LINUX_ARM64_RUNNER: ubuntu-24.04-arm
  BUILDX_MANIFEST_SUFFIXES: amd64 arm64

jobs:
  prepare:

    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      docker_registry_url: ${{ steps.default_env.outputs.docker_registry_url }}
      docker_registry_owner: ${{ steps.default_env.outputs.docker_registry_owner }}
      java_version: ${{ steps.build_args.outputs.java_version }}
      tracking_git_ref: ${{ steps.build_args.outputs.tracking_git_ref }}
      tracking_git_repo: ${{ steps.build_args.outputs.tracking_git_repo }}
      vcs_ref: ${{ steps.build_args.outputs.vcs_ref }}
      version: ${{ steps.build_args.outputs.version }}
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#permissions
    permissions:
      actions: none
      checks: none
      contents: read
      deployments: none
      issues: none
      discussions: none
      packages: none
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none

    steps:
      -
        name: Set Default Environment Variables
        id: default_env
        env:
          HAS_DOCKER_REGISTRY_TOKEN: ${{ secrets.DOCKER_REGISTRY_TOKEN != '' }}
        run: |
          set -euo pipefail
          docker_registry_url="${DOCKER_REGISTRY_URL:-docker.io}"
          docker_registry_owner="${DOCKER_REGISTRY_OWNER:-${GITHUB_REPOSITORY_OWNER}}"
          if [[ "${HAS_DOCKER_REGISTRY_TOKEN}" != "true" ]]; then
            docker_registry_url="ghcr.io"
            docker_registry_owner="${GITHUB_REPOSITORY_OWNER}"
          fi
          printf "DOCKER_REGISTRY_URL=%s\n" "${docker_registry_url}" >> "$GITHUB_ENV"
          printf "DOCKER_REGISTRY_OWNER=%s\n" "${docker_registry_owner}" >> "$GITHUB_ENV"
          printf "docker_registry_url=%s\n" "${docker_registry_url}" >> "$GITHUB_OUTPUT"
          printf "docker_registry_owner=%s\n" "${docker_registry_owner}" >> "$GITHUB_OUTPUT"
          if [[ "${{ inputs.tracking_git_repo || '' }}" != "" ]]; then
            echo "TRACKING_GIT_REPO=${{ inputs.tracking_git_repo }}" >> $GITHUB_ENV
          fi
          if [[ "${{ inputs.tracking_git_ref || '' }}" != "" ]]; then
            echo "TRACKING_GIT_REF=${{ inputs.tracking_git_ref }}" >> $GITHUB_ENV
          fi

      # This action checks-out your repository under $GITHUB_WORKSPACE, so your workflow can access it.
      # https://github.com/actions/checkout
      -
        name: Checkout repository
        id: checkout
        # You may pin to the exact commit or the version.
        # uses: https://github.com/actions/checkout/tags
        uses: actions/checkout@v7
        with:
          submodules: recursive

      -
        name: Resolve build metadata
        id: build_args
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -n "${TRACKING_GIT_REF}" ]]; then
            make checkout-source TRACKING_GIT_REPO="${TRACKING_GIT_REPO}" TRACKING_GIT_REF="${TRACKING_GIT_REF}"
            PACKAGE_VERSION="$(sed -n -E 's/.*<version>([0-9]+\.[0-9]+\.[0-9]+[^<]*)<\/version>.*/\1/p' athenz/pom.xml | head -n1)"
            TAG_VERSION="$(git -C athenz rev-parse --short HEAD)"
            if [[ -z "${PACKAGE_VERSION}" ]]; then
              echo "No valid package version found in ${TRACKING_GIT_REPO}@${TRACKING_GIT_REF}" >&2
              exit 1
            fi
          elif [[ "${{ github.event_name != 'pull_request' && inputs.publish_images && inputs.target_version != '' && inputs.target_version != inputs.current_version }}" = "true" ]]; then
            if [[ "${{ inputs.target_version }}" =~ .*([0-9]+.[0-9]+.[0-9]+).* ]]; then
              PACKAGE_VERSION="$(echo "${{ inputs.target_version }}" | sed -E 's/.*([0-9]+\.[0-9]+\.[0-9]+).*/\1/g')"
              TAG_VERSION="v${PACKAGE_VERSION}"
            fi
          elif [[ "${{ github.ref }}" == "refs/tags/"* ]] && [[ "$(basename "${{ github.ref }}")" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)(-[a-z]+)?(\.[0-9]+)?$ ]]; then
            PACKAGE_VERSION="$(git tag --points-at HEAD | sed -e 's/.*v\([0-9]*.[0-9]*.[0-9]*\).*/\1/g')"
            TAG_VERSION="$(git tag --points-at HEAD | sed -e 's/.*\(v[0-9]*.[0-9]*.[0-9]*\).*/\1/g')"
          else
            LATEST_TAG=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" https://api.github.com/repos/${TRACKING_GIT_REPO}/releases \
              | jq -r '.[].tag_name' \
              | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+)?(\.[0-9]+)?$' \
              | sort -ruV \
              | head -n1)
            if [[ -n "$LATEST_TAG" ]]; then
              PACKAGE_VERSION=$(echo "$LATEST_TAG" | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
              TAG_VERSION="v${PACKAGE_VERSION}"
            else
              echo "No valid version tag found in releases for ${TRACKING_GIT_REPO}" >&2
              exit 1
            fi
          fi

          if [[ $(printf '%s\n' "1.12.0" "${PACKAGE_VERSION}" | sort -V | head -n1) = "1.12.0" ]]; then
            JAVA_VERSION=17
          else
            JAVA_VERSION=11
          fi

          printf "java_version=%s\n" "${JAVA_VERSION}" >> "$GITHUB_OUTPUT"
          printf "tracking_git_ref=%s\n" "${TRACKING_GIT_REF}" >> "$GITHUB_OUTPUT"
          printf "tracking_git_repo=%s\n" "${TRACKING_GIT_REPO}" >> "$GITHUB_OUTPUT"
          printf "vcs_ref=%s\n" "${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          printf "version=%s\n" "${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

      -
        name: Resolve build matrix
        id: matrix
        env:
          LINUX_RUNNER_OVERRIDE: ${{ vars.LINUX_RUNNER || '' }}
          LINUX_ARM64_RUNNER_OVERRIDE: ${{ vars.LINUX_ARM64_RUNNER || '' }}
        run: |
          set -euo pipefail
          linux_runner="${LINUX_RUNNER_OVERRIDE:-${LINUX_RUNNER}}"
          linux_arm64_runner="${LINUX_ARM64_RUNNER_OVERRIDE:-${LINUX_ARM64_RUNNER}}"
          matrix="$(jq -nc --arg linux_runner "${linux_runner}" --arg linux_arm64_runner "${linux_arm64_runner}" '{include:[{platform:"linux/amd64",runner:$linux_runner,tag_suffix:"amd64"},{platform:"linux/arm64",runner:$linux_arm64_runner,tag_suffix:"arm64"}]}')"
          printf "matrix=%s\n" "${matrix}" >> "$GITHUB_OUTPUT"

  build:

    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}
    env:
      DOCKER_REGISTRY_URL: ${{ needs.prepare.outputs.docker_registry_url }}
      DOCKER_REGISTRY_OWNER: ${{ needs.prepare.outputs.docker_registry_owner }}
      DOCKER_TAEGET_PLATFORMS: ${{ matrix.platform }}
      BUILDX_TAG_SUFFIX: -${{ matrix.tag_suffix }}
      TRACKING_GIT_REF: ${{ needs.prepare.outputs.tracking_git_ref }}
      TRACKING_GIT_REPO: ${{ needs.prepare.outputs.tracking_git_repo }}
      VCS_REF: ${{ needs.prepare.outputs.vcs_ref }}
      VERSION: ${{ needs.prepare.outputs.version }}
      XPLATFORMS: ${{ matrix.platform }}
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#permissions
    permissions:
      actions: none
      checks: none
      contents: read
      deployments: none
      issues: none
      discussions: none
      packages: write
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none

    steps:
      # This action checks-out your repository under $GITHUB_WORKSPACE, so your workflow can access it.
      # https://github.com/actions/checkout
      -
        name: Checkout repository
        id: checkout
        # You may pin to the exact commit or the version.
        # uses: https://github.com/actions/checkout/tags
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # GitHub Action to login against a Docker registry.
      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      -
        name: Docker Login to registry ${{ env.DOCKER_REGISTRY_URL }}
        id: login
        if: ${{ github.event_name != 'pull_request' && inputs.publish_images }}
        # You may pin to the exact commit or the version.
        # uses: https://github.com/docker/login-action/tags
        uses: docker/login-action@v4
        with:
          # Server address of Docker registry. If not set then will default to Docker Hub
          registry: ${{ env.DOCKER_REGISTRY_URL }} # optional
          # Username used to log against the Docker registry
          username: ${{ env.DOCKER_REGISTRY_OWNER }} # optional
          # Password or personal access token used to log against the Docker registry
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN != '' && secrets.DOCKER_REGISTRY_TOKEN || github.token }} # optional
          # Log out from the Docker registry at the end of a job
          logout: true # optional, default is true

      # GitHub Action to install QEMU static binaries.
      # https://github.com/docker/setup-qemu-action
      -
        name: Set up QEMU
        id: qemu
        if: ${{ matrix.platform == 'linux/arm64' && runner.arch != 'ARM64' }}
        # You may pin to the exact commit or the version.
        # uses: https://github.com/docker/setup-qemu-action/tags
        uses: docker/setup-qemu-action@v4

      # GitHub Action to set up Docker Buildx.
      # https://github.com/docker/setup-buildx-action
      -
        name: Set up Docker Buildx
        id: buildx
        # You may pin to the exact commit or the version.
        # uses: https://github.com/docker/setup-buildx-action/tags
        uses: docker/setup-buildx-action@v4

      # This action sets up a go environment for use in actions by:
      # - Optionally downloading and caching a version of Go by version and adding to PATH.
      # - Registering problem matchers for error output.
      # https://github.com/actions/setup-go
      -
        name: Setup Golang
        id: setup-go
        # You may pin to the exact commit or the version.
        # uses: https://github.com/actions/setup-go/tags
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # A GitHub Action to set environment variables for Go
      -
        name: Set Golang env
        id: go-env
        run: |
          go env | grep GOPATH | sed -e "s/'//g" >> $GITHUB_ENV

      # This action allows caching dependencies and build outputs to improve workflow execution time.
      # https://github.com/actions/cache
      -
        name: Cache Go Modules
        id: cache-go
        # uses: https://github.com/actions/cache/tags
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # This action provides the following functionality for GitHub Actions runners:
      # - Downloading and setting up a requested version of Java. See [Usage](#usage) for a list of supported distributions.
      # - Extracting and caching custom version of Java from a local file.
      # - Configuring runner for publishing using Apache Maven.
      # - Configuring runner for publishing using Gradle.
      # - Configuring runner for using GPG private key.
      # - Registering problem matchers for error output.
      # - Caching dependencies managed by Apache Maven.
      # - Caching dependencies managed by Gradle.
      # - Caching dependencies managed by sbt.
      # - [Maven Toolchains declaration](https://maven.apache.org/guides/mini/guide-using-toolchains.html) for specified JDK versions.
      # 
      # This action allows you to work with Java and Scala projects.
      # https://github.com/actions/setup-java
      -
        name: Setup Java
        id: setup-java
        # uses: https://github.com/actions/setup-java/tags
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ needs.prepare.outputs.java_version }}
          #cache: maven

      # Build Docker image with Buildx. Push only when publish_images is true.
      # https://github.com/docker/build-push-action
      -
        name: Build Docker image for ${{ matrix.platform }}
        id: build_and_push
        # You may pin to the exact commit or the version.
        # uses: https://github.com/docker/build-push-action/tags
        run: |
          if [[ "${{ github.event_name != 'pull_request' && inputs.publish_images }}" = "true" ]]; then \
            DOCKER_REGISTRY="${{ env.DOCKER_REGISTRY_URL }}/${{ env.DOCKER_REGISTRY_OWNER }}/" \
            XPLATFORMS="${{ matrix.platform }}" \
            BUILDX_TAG_SUFFIX="-${{ matrix.tag_suffix }}" \
            PUSH=true \
            make buildx; \
          else \
            DOCKER_REGISTRY="${{ env.DOCKER_REGISTRY_URL }}/${{ env.DOCKER_REGISTRY_OWNER }}/" \
            XPLATFORMS="${{ matrix.platform }}" \
            BUILDX_TAG_SUFFIX="-${{ matrix.tag_suffix }}" \
            PUSH=false \
            make buildx; \
          fi
        #uses: docker/build-push-action@v4
        #with:
        #  context: .
        #  push: ${{ github.event_name != 'pull_request' }}
        #  tags: ${{ steps.meta.outputs.tags }}
        #  labels: ${{ steps.meta.outputs.labels }}
        #  platforms: ${{ env.DOCKER_TAEGET_PLATFORMS }}
        #  build-args: ${{ env.DOCKER_BUILD_ARGS }}
        #  cache-from: ${{ env.DOCKER_REGISTRY_URL }}/${{ env.DOCKER_REGISTRY_OWNER }}/${{ env.DOCKER_REGISTRY_IMAGE }}

  manifest:

    name: Publish Docker multi-platform manifests
    needs:
      - build
      - prepare
    if: ${{ github.event_name != 'pull_request' && inputs.publish_images }}
    runs-on: ubuntu-latest
    env:
      DOCKER_REGISTRY_URL: ${{ needs.prepare.outputs.docker_registry_url }}
      DOCKER_REGISTRY_OWNER: ${{ needs.prepare.outputs.docker_registry_owner }}
      TRACKING_GIT_REF: ${{ needs.prepare.outputs.tracking_git_ref }}
      TRACKING_GIT_REPO: ${{ needs.prepare.outputs.tracking_git_repo }}
      VCS_REF: ${{ needs.prepare.outputs.vcs_ref }}
      VERSION: ${{ needs.prepare.outputs.version }}
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#permissions
    permissions:
      actions: none
      checks: none
      contents: read
      deployments: none
      issues: none
      discussions: none
      packages: write
      pull-requests: none
      repository-projects: none
      security-events: none
      statuses: none

    steps:
      # This action checks-out your repository under $GITHUB_WORKSPACE, so your workflow can access it.
      # https://github.com/actions/checkout
      -
        name: Checkout repository
        id: checkout
        # You may pin to the exact commit or the version.
        # uses: https://github.com/actions/checkout/tags
        uses: actions/checkout@v7

      # GitHub Action to login against a Docker registry.
      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      -
        name: Docker Login to registry ${{ env.DOCKER_REGISTRY_URL }}
        id: login
        # You may pin to the exact commit or the version.
        # uses: https://github.com/docker/login-action/tags
        uses: docker/login-action@v4
        with:
          # Server address of Docker registry. If not set then will default to Docker Hub
          registry: ${{ env.DOCKER_REGISTRY_URL }} # optional
          # Username used to log against the Docker registry
          username: ${{ env.DOCKER_REGISTRY_OWNER }} # optional
          # Password or personal access token used to log against the Docker registry
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN != '' && secrets.DOCKER_REGISTRY_TOKEN || github.token }} # optional
          # Log out from the Docker registry at the end of a job
          logout: true # optional, default is true

      # GitHub Action to set up Docker Buildx.
      # https://github.com/docker/setup-buildx-action
      -
        name: Set up Docker Buildx
        id: buildx
        # You may pin to the exact commit or the version.
        # uses: https://github.com/docker/setup-buildx-action/tags
        uses: docker/setup-buildx-action@v4

      -
        name: Create Docker multi-platform manifests
        id: manifest
        run: |
          DOCKER_REGISTRY="${{ env.DOCKER_REGISTRY_URL }}/${{ env.DOCKER_REGISTRY_OWNER }}/" \
          BUILDX_MANIFEST_SUFFIXES="${{ env.BUILDX_MANIFEST_SUFFIXES }}" \
          make buildx-manifest
