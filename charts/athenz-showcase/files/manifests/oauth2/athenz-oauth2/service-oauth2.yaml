---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: oauth2-service
  name: oauth2
  namespace: athenz
spec:
  ports:
  - name: callback
    port: 8080
    targetPort: callback
  - name: https
    port: 443
    targetPort: https
  - name: dex
    port: 5556
    targetPort: dex
  - name: envoy
    port: 10000
    targetPort: envoy
  - name: keycloak-http
    port: 18080
    targetPort: keycloak-http
  - name: keycloak-https
    port: 10001
    targetPort: keycloak-https
  selector:
    app: oauth2-deployment
  type: ClusterIP
