---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: rustfs
    app.kubernetes.io/name: rustfs
  name: rustfs
  namespace: athenz
spec:
  ports:
  - name: s3-api
    port: 9000
    protocol: TCP
    targetPort: s3-api
  - name: console
    port: 9001
    protocol: TCP
    targetPort: console
  selector:
    app.kubernetes.io/instance: rustfs
    app.kubernetes.io/name: rustfs
  type: ClusterIP
