---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/instance: rustfs
    app.kubernetes.io/name: rustfs
  name: rustfs
  namespace: athenz
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: rustfs
      app.kubernetes.io/name: rustfs
  serviceName: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: rustfs
        app.kubernetes.io/name: rustfs
    spec:
      containers:
      - command:
        - rustfs
        - server
        - "/data"
        env:
        - name: RUSTFS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: RUSTFS_ACCESS_KEY
              name: rustfs-credentials
        - name: RUSTFS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: RUSTFS_SECRET_KEY
              name: rustfs-credentials
        - name: RUSTFS_CONSOLE_ADDRESS
          value: :9001
        - name: RUSTFS_SERVER_DOMAINS
          value: rustfs.athenz:9000
        image: docker.io/rustfs/rustfs:latest
        imagePullPolicy: IfNotPresent
        name: rustfs
        ports:
        - containerPort: 9000
          name: s3-api
          protocol: TCP
        - containerPort: 9001
          name: console
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: s3-api
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - mountPath: "/data"
          name: data
      restartPolicy: Always
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsUser: 10001
      volumes:
      - emptyDir: {}
        name: data
