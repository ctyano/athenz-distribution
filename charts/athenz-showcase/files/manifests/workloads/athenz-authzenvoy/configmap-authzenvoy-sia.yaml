---
apiVersion: v1
data:
  ATHENZ_DOMAIN: ''
  ATHENZ_PREFIX: ''
  ATHENZ_SUFFIX: ''
  AUTHORIZATION_CACHE_INTERVAL: 30s
  AUTHORIZATION_POLICY_DOMAINS: athenz
  AUTHORIZATION_SERVER_ADDR: :8280
  BACKUP: '""'
