  ENDPOINT: https://athenz-zts-server.athenz:4443/zts/v1
  KEY_FILE: "/var/run/athenz/tls.key"
  LOG_DIR: "/dev/null"
  LOG_LEVEL: DEBUG
  METRICS_SERVER_ADDR: :9999
  MODE: init
  NAMESPACE: ''
  POD_IP: ''
  POD_UID: ''
  POLICY_REFRESH_INTERVAL: 30s
  PROVIDER_SERVICE: athenz.identityprovider
