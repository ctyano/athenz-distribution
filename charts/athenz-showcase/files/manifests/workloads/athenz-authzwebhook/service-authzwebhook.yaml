---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: authzwebhook-service
  name: authzwebhook
  namespace: athenz
spec:
  ports:
  - name: https
    port: 443
    targetPort: https
  - name: mtls
    port: 4443
    targetPort: mtls
  selector:
    app: authzwebhook-deployment
  type: ClusterIP
