---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: athenz-mcp-server
  labels:
    app.kubernetes.io/name: athenz-mcp-server
    app.kubernetes.io/instance: athenz-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: athenz-mcp-server
      app.kubernetes.io/instance: athenz-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: athenz-mcp-server
        app.kubernetes.io/instance: athenz-mcp-server
    spec:
      initContainers:
        - name: pip-install
          image: python:3-slim
          command: ["pip", "install", "--no-cache-dir", "-r", "/app/requirements.txt"]
          volumeMounts:
            - name: src
              mountPath: /app
            - name: pip-cache
              mountPath: /root/.cache/pip
      containers:
        - name: mcp-server
          image: python:3-slim
          command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000"]
          workingDir: /app
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: athenz-mcp-server-conf
          volumeMounts:
            - name: src
              mountPath: /app
            - name: pip-cache
              mountPath: /root/.cache/pip
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: src
          configMap:
            name: athenz-mcp-server-src
        - name: pip-cache
          emptyDir: {}
