apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-emulator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aws-emulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aws-emulator
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      volumes:
        - name: state
          emptyDir: {}
        - name: envoy
          configMap:
            name: aws-emulator-envoy
        - name: identity
          projected:
            sources:
              - secret:
                  name: athenz-zts-certs
                  items:
                    - key: zts.cert.pem
                      path: tls.crt
              - secret:
                  name: athenz-zts-keys
                  items:
                    - key: zts.private.pem
                      path: tls.key
      containers:
        - name: aws-emulator
          image: ghcr.io/ctyano/docker-aws-emulator:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 2Gi
              cpu: 2
          volumeMounts:
            - name: state
              mountPath: /home/emulator/.aws/emulator
        - name: sia-imds
          image: ghcr.io/ctyano/k8s-athenz-sia:awsimds
          imagePullPolicy: IfNotPresent
          args:
            - --mode=refresh
            - --cert=/var/run/athenz/tls.crt
            - --key=/var/run/athenz/tls.key
            - --endpoint=https://athenz-zts-server.athenz:4443/zts/v1
            - --refresh-interval=0
            - --token-refresh-interval=0
            - --log-dir=/tmp
            - --use-imds-server
            - --imds-source=file
            - --imds-role=zts
            - --imds-credentials-file=/var/run/aws-emulator/9297/emulator_credentials
          resources: &sidecar-resources
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 100m
          volumeMounts:
            - name: state
              mountPath: /var/run/aws-emulator
              readOnly: true
            - name: identity
              mountPath: /var/run/athenz
              readOnly: true
        - name: envoy
          image: docker.io/envoyproxy/envoy:v1.34-latest
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              until test -s /var/run/aws-emulator/9297/ca.pem; do sleep 1; done
              exec envoy -c /etc/envoy/config.yaml --concurrency 1
          ports:
            - name: http
              containerPort: 9298
            - name: imds
              containerPort: 1339
          readinessProbe:
            httpGet:
              path: /__admin/health
              port: http
            periodSeconds: 2
          resources: *sidecar-resources
          volumeMounts:
            - name: state
              mountPath: /var/run/aws-emulator
              readOnly: true
            - name: envoy
              mountPath: /etc/envoy
              readOnly: true
        - name: aws-cli
          image: docker.io/amazon/aws-cli:latest
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -c]
          args: ["sleep infinity"]
          env:
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /var/run/aws-emulator/9297/emulator_credentials
            - name: AWS_CA_BUNDLE
              value: /var/run/aws-emulator/9297/ca.pem
            - name: AWS_ENDPOINT_URL
              value: https://127.0.0.1:9297
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          resources: *sidecar-resources
          volumeMounts:
            - name: state
              mountPath: /var/run/aws-emulator
              readOnly: true
