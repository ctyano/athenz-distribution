spec:
  template:
    spec:
      securityContext:
        fsGroup: 10001
      volumes:
        - name: aws-emulator-state
          emptyDir: {}
        - name: aws-emulator-imds-identity
          projected:
            sources:
              - secret:
                  name: athenz-zts-certs
                  items:
                    - key: zts.cert.pem
                      path: zts.cert.pem
              - secret:
                  name: athenz-zts-keys
                  items:
                    - key: zts.private.pem
                      path: zts.private.pem
      containers:
        - name: athenz-zts-server
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until test -s /var/run/aws-emulator/9297/ca.pem; do sleep 1; done
              keytool -delete -alias aws-emulator \
                -keystore /var/run/athenz/truststore/zts_truststore.jks \
                -storetype JKS -storepass athenz >/dev/null 2>&1 || true
              keytool -importcert -noprompt -alias aws-emulator \
                -file /var/run/aws-emulator/9297/ca.pem \
                -keystore /var/run/athenz/truststore/zts_truststore.jks \
                -storetype JKS -storepass athenz
              exec /usr/local/bin/docker-entrypoint.sh
          env:
            - name: ATHENZ__ZTS__AWS_ENABLED
              value: "true"
            - name: ATHENZ__ZTS__AWS_REGION_NAME
              value: us-east-1
            - name: ATHENZ__ZTS__AWS_CREDS_INVALID_CACHE_TIMEOUT
              value: "0"
            - name: AWS_ENDPOINT_URL_STS
              value: https://127.0.0.1:9297
            - name: AWS_EC2_METADATA_SERVICE_ENDPOINT
              value: http://127.0.0.1:1338
          volumeMounts:
            - name: aws-emulator-state
              mountPath: /var/run/aws-emulator
              readOnly: true
        - name: aws-emulator
          image: ghcr.io/ctyano/docker-aws-emulator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: emulator-https
              containerPort: 9297
          readinessProbe:
            tcpSocket:
              port: 9297
            periodSeconds: 2
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 2Gi
              cpu: 2
          volumeMounts:
            - name: aws-emulator-state
              mountPath: /home/emulator/.aws/emulator
        - name: aws-emulator-imds
          image: ghcr.io/ctyano/k8s-athenz-sia:awsimds
          imagePullPolicy: IfNotPresent
          args:
            - -mode=refresh
            - -cert=/var/run/athenz/identity/zts.cert.pem
            - -key=/var/run/athenz/identity/zts.private.pem
            - -endpoint=https://athenz-zts-server.athenz:4443/zts/v1
            - -refresh-interval=0
            - -token-refresh-interval=0
            - -log-dir=/tmp
            - -use-imds-server
            - -imds-source=file
            - -imds-role=zts
            - -imds-credentials-file=/var/run/aws-emulator/9297/emulator_credentials
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m
          volumeMounts:
            - name: aws-emulator-state
              mountPath: /var/run/aws-emulator
              readOnly: true
            - name: aws-emulator-imds-identity
              mountPath: /var/run/athenz/identity
              readOnly: true
