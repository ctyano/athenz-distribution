---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-create-bucket
  labels:
    app.kubernetes.io/name: rustfs-create-bucket
    app.kubernetes.io/instance: rustfs
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-create-bucket
        app.kubernetes.io/instance: rustfs
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws-cli
          image: docker.io/amazon/aws-cli:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_SECRET_KEY
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: ENDPOINT_URL
              value: http://rustfs.athenz:9000
            - name: BUCKET
              value: zms-domains
          command: ["/bin/sh", "-c"]
          args:
            - |
              until aws --endpoint-url "${ENDPOINT_URL}" s3api list-buckets >/dev/null 2>&1; do
                echo "Waiting for rustfs..."
                sleep 2
              done
              aws --endpoint-url "${ENDPOINT_URL}" s3api head-bucket --bucket "${BUCKET}" >/dev/null 2>&1 || \
                aws --endpoint-url "${ENDPOINT_URL}" s3api create-bucket --bucket "${BUCKET}"
